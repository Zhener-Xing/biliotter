<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 对话</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="chat-window" id="chat-root">
    <header class="chat-bar">
      <div class="chat-bar-text">
        <p class="chat-kicker">BiliOtter · CHAT</p>
        <h1 class="chat-title" id="chat-title">AI 对话</h1>
      </div>
      <button type="button" class="chat-close" id="chat-close" aria-label="关闭">×</button>
    </header>

    <div id="chat-log" class="chat-log" aria-live="polite"></div>

    <div id="game-panel" class="game-panel" hidden>
      <div class="game-stage">
        <canvas
          id="game-run-canvas"
          class="game-run-canvas"
          width="220"
          height="150"
          aria-hidden="true"
        ></canvas>
        <div class="game-qa-row">
          <img
            id="game-otter"
            class="game-otter"
            src="../assets/game-skills/staring-otter/stare.png"
            width="81"
            height="76"
            alt="BiliOtter"
            draggable="false"
          />
          <div class="game-dialog" id="game-dialog" aria-live="polite">
            <p class="game-dialog-text" id="game-question"></p>
          </div>
        </div>
      </div>
      <div class="game-options" id="game-options" role="group" aria-label="选项">
        <button type="button" class="game-option" data-choice="0" disabled>
          <span class="game-option-key">A</span>
          <span class="game-option-label"></span>
        </button>
        <button type="button" class="game-option" data-choice="1" disabled>
          <span class="game-option-key">B</span>
          <span class="game-option-label"></span>
        </button>
        <button type="button" class="game-option" data-choice="2" disabled>
          <span class="game-option-key">C</span>
          <span class="game-option-label"></span>
        </button>
        <button type="button" class="game-option" data-choice="3" disabled>
          <span class="game-option-key">D</span>
          <span class="game-option-label"></span>
        </button>
      </div>
      <p class="game-feedback" id="game-feedback" hidden></p>
      <p class="game-hint">中途退出：⌘S+G</p>
    </div>

    <form id="chat-form" class="chat-form">
      <input
        id="chat-input"
        class="chat-input"
        type="text"
        maxlength="800"
        placeholder="说点什么…"
        autocomplete="off"
      />
      <button type="submit" id="chat-send" class="chat-send">发送</button>
    </form>
  </div>
  <script src="chat.js"></script>
</body>
</html>
