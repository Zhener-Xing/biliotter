<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiliOtter · 知识库</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #3b2a1f;
        --muted: #7a6352;
        --paper: #f4ebe0;
        --paper-2: #e7d7c4;
        --panel: #fff8f0;
        --accent: #b07a45;
        --accent-deep: #8f5e32;
        --accent-ink: #fff8f0;
        --danger: #b0483a;
        --slot: #c9a27a;
        --slot-empty: #e7d7c4;
        --line: #3b2a1f;
        --shadow: 6px 6px 0 #3b2a1f;
        --shadow-soft: 4px 4px 0 #3b2a1f;
        --toast-bg: #3b2a1f;
        --toast-ink: #fff8f0;
        --rail: #faf4ec;
        --hit: #f0e0cc;
        --font-ui: "ZCOOL KuaiLe", "Nunito", "PingFang SC", "Hiragino Sans GB", sans-serif;
        --font-body: "Nunito", "PingFang SC", "Hiragino Sans GB", sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { height: 100%; overflow: hidden; }

      body {
        font-family: var(--font-ui);
        color: var(--ink);
        background:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(59, 42, 31, 0.035) 3px,
            rgba(59, 42, 31, 0.035) 4px
          ),
          linear-gradient(180deg, var(--paper), var(--paper-2));
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(1100px, calc(100vw - 32px));
        height: min(720px, calc(100vh - 32px));
        border: 4px solid var(--line);
        box-shadow: var(--shadow);
        background: var(--panel);
        display: grid;
        grid-template-columns: minmax(260px, 320px) 1fr;
        overflow: hidden;
        image-rendering: pixelated;
      }

      /* —— 左侧目录 —— */
      .sidebar {
        background: var(--rail);
        border-right: 4px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .brand {
        padding: 18px 16px 12px;
        border-bottom: 3px solid var(--line);
        flex-shrink: 0;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .brand-text { flex: 1; min-width: 0; }

      .brand h1 {
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0.02em;
        font-weight: 400;
      }

      .brand h1 span { color: var(--accent); }

      .brand-sub {
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }

      .btn-close-window {
        appearance: none;
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border: 3px solid var(--line);
        background: var(--slot);
        color: var(--accent-ink);
        font: inherit;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--line);
        display: grid;
        place-items: center;
      }

      .btn-close-window:hover {
        background: var(--danger);
        color: #fff8f0;
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--line);
      }

      .side-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border-bottom: 3px solid var(--line);
        flex-shrink: 0;
      }

      .side-tab {
        appearance: none;
        border: 0;
        border-right: 3px solid var(--line);
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 15px;
        padding: 10px 8px;
        cursor: pointer;
      }

      .side-tab:last-child { border-right: 0; }

      .side-tab:hover { background: rgba(59, 42, 31, 0.04); color: var(--ink); }

      .side-tab.active {
        background: var(--slot);
        color: var(--accent-ink);
      }

      .side-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
      .side-panel.active { display: flex; }

      .course-actions {
        padding: 10px 12px 0;
        flex-shrink: 0;
      }

      .course-actions .btn { width: 100%; }

      .search-wrap {
        padding: 12px 12px 8px;
        flex-shrink: 0;
      }

      .search-input {
        width: 100%;
        border: 3px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        padding: 10px 12px;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.06);
        outline: none;
      }

      .search-input:focus {
        box-shadow: 3px 3px 0 var(--line);
      }

      .search-input::placeholder { color: var(--muted); }

      .hits {
        padding: 0 12px 8px;
        flex-shrink: 0;
        max-height: 140px;
        overflow: auto;
        display: none;
      }

      .hits.show { display: block; }

      .hits-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .hit-item {
        appearance: none;
        width: 100%;
        text-align: left;
        border: 2px solid var(--line);
        background: var(--hit);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--line);
        line-height: 1.45;
      }

      .hit-item:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--line);
      }

      .hit-item strong {
        display: block;
        font-size: 14px;
        margin-bottom: 2px;
      }

      .hit-item span {
        color: var(--muted);
        font-family: var(--font-body);
        font-size: 12px;
      }

      .list-meta {
        padding: 4px 14px 8px;
        font-size: 12px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .note-list {
        list-style: none;
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 0 10px 14px;
      }

      .note-item {
        appearance: none;
        width: 100%;
        text-align: left;
        border: 3px solid var(--line);
        background: var(--slot-empty);
        color: var(--ink);
        font: inherit;
        padding: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        box-shadow: var(--shadow-soft);
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        opacity: 0;
        transform: translateY(10px);
        animation: stagger-in 0.35s ease forwards;
      }

      .note-item:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--line);
        background: #f0e4d4;
      }

      .note-item.active {
        background: var(--slot);
        color: var(--accent-ink);
      }

      .note-item.active .note-sub { color: rgba(255, 248, 240, 0.85); }

      .note-title {
        font-size: 16px;
        line-height: 1.35;
        margin-bottom: 6px;
        word-break: break-word;
      }

      .note-sub {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .list-empty {
        padding: 24px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 15px;
      }

      .course-tree {
        list-style: none;
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 0 10px 14px;
      }

      .course-node {
        margin-bottom: 10px;
        border: 3px solid var(--line);
        background: var(--slot-empty);
        box-shadow: var(--shadow-soft);
      }

      .course-node.active {
        background: #f0e4d4;
      }

      .course-node-head {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 10px;
        cursor: pointer;
        width: 100%;
        text-align: left;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
      }

      .course-node-head:hover { background: rgba(59, 42, 31, 0.04); }

      .course-chevron {
        flex-shrink: 0;
        width: 1.1em;
        font-size: 14px;
        line-height: 1.4;
        color: var(--muted);
      }

      .course-node-main { flex: 1; min-width: 0; }

      .course-node-title {
        font-size: 15px;
        line-height: 1.35;
        word-break: break-word;
      }

      .course-node-sub {
        font-family: var(--font-body);
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }

      .course-node-body {
        border-top: 2px solid var(--line);
        padding: 8px;
        background: var(--panel);
      }

      .course-node-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }

      .course-node-actions .btn {
        padding: 4px 8px;
        font-size: 12px;
      }

      .folder-node {
        border: 2px solid var(--line);
        background: #f7efe4;
        margin-bottom: 8px;
      }

      .folder-node-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        cursor: pointer;
        width: 100%;
        text-align: left;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }

      .folder-node-head:hover { background: rgba(59, 42, 31, 0.04); }

      .folder-node-title { flex: 1; min-width: 0; word-break: break-word; }

      .folder-node-actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }

      .folder-node-actions .btn {
        padding: 2px 6px;
        font-size: 11px;
      }

      .folder-node-body {
        display: none;
        border-top: 2px solid var(--line);
        padding: 6px;
        background: var(--slot-empty);
      }

      .folder-node.open .folder-node-body { display: block; }

      .tree-note-item {
        appearance: none;
        width: 100%;
        text-align: left;
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        padding: 8px;
        margin-bottom: 6px;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--line);
      }

      .tree-note-item:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--line);
      }

      .tree-note-item.active {
        background: var(--slot);
        color: var(--accent-ink);
      }

      .tree-note-item .tn-title {
        display: block;
        line-height: 1.35;
        word-break: break-word;
      }

      .tree-note-item .tn-sub {
        display: block;
        margin-top: 2px;
        font-family: var(--font-body);
        font-size: 11px;
        opacity: 0.85;
      }

      .tree-note-item .status-pill {
        margin-left: 0;
        margin-top: 4px;
      }

      .side-add-box {
        margin-top: 8px;
        border: 2px dashed var(--line);
        padding: 8px;
        background: rgba(255, 248, 240, 0.7);
      }

      .side-add-box h4 {
        font-size: 13px;
        margin-bottom: 8px;
      }

      .side-add-box .course-form label { font-size: 12px; }
      .side-add-box .course-form input,
      .side-add-box .course-form select {
        font-size: 13px;
        padding: 7px 8px;
      }

      .side-create-box {
        margin: 0 10px 10px;
        border: 3px solid var(--line);
        padding: 10px;
        background: var(--panel);
        display: none;
      }

      .side-create-box.show { display: block; }

      .course-item-badge {
        display: inline-block;
        margin-top: 4px;
        font-family: var(--font-body);
        font-size: 11px;
        padding: 2px 6px;
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--muted);
      }

      .folder-block {
        display: none;
      }

      .course-form {
        display: grid;
        gap: 10px;
      }

      .course-form label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
      }

      .course-form input,
      .course-form textarea,
      .course-form select {
        width: 100%;
        border: 3px solid var(--line);
        background: var(--slot-empty);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        padding: 10px 12px;
        outline: none;
      }

      .course-form textarea {
        min-height: 72px;
        resize: vertical;
        font-family: var(--font-body);
      }

      .course-form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .video-list {
        list-style: none;
        margin-top: 14px;
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding-right: 2px;
      }

      .video-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
        border: 3px solid var(--line);
        background: var(--slot-empty);
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: var(--shadow-soft);
      }

      .video-row-main { min-width: 0; }

      .video-row-title {
        font-size: 16px;
        line-height: 1.35;
        word-break: break-word;
        margin-bottom: 4px;
      }

      .video-row-sub {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .video-row-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .video-row-actions .btn {
        padding: 5px 10px;
        font-size: 13px;
        white-space: nowrap;
      }

      .course-form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .add-mode-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 3px solid var(--line);
        overflow: hidden;
      }

      .add-mode-tab {
        appearance: none;
        border: 0;
        border-right: 3px solid var(--line);
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        padding: 8px 6px;
        cursor: pointer;
      }

      .add-mode-tab:last-child { border-right: 0; }

      .add-mode-tab.active {
        background: var(--slot);
        color: var(--accent-ink);
      }

      .add-video-box {
        margin-top: 14px;
        border: 3px dashed var(--line);
        padding: 12px;
        background: rgba(255, 248, 240, 0.55);
        flex-shrink: 0;
      }

      .add-video-box[hidden] {
        display: none !important;
      }

      .add-video-box h3 {
        font-size: 15px;
        margin-bottom: 10px;
      }

      .folder-block {
        border: 3px solid var(--line);
        background: #f7efe4;
        margin-bottom: 12px;
        box-shadow: var(--shadow-soft);
      }

      .folder-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 12px;
        border-bottom: 2px solid var(--line);
        background: var(--slot-empty);
      }

      .folder-head-title {
        font-size: 16px;
        flex: 1;
        min-width: 120px;
      }

      .folder-head .btn {
        padding: 4px 9px;
        font-size: 12px;
      }

      .folder-body {
        padding: 10px 10px 4px;
      }

      .folder-body .video-row {
        margin-bottom: 8px;
      }

      .folder-empty {
        padding: 8px 4px 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .course-toolbar-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 4px;
      }

      .course-form select {
        width: 100%;
        border: 3px solid var(--line);
        background: var(--slot-empty);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        padding: 10px 12px;
        outline: none;
      }

      .move-select {
        max-width: 140px;
        border: 2px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        padding: 4px 6px;
      }

      .status-pill {
        display: inline-block;
        font-family: var(--font-body);
        font-size: 11px;
        border: 2px solid var(--line);
        padding: 1px 6px;
        margin-left: 6px;
        vertical-align: middle;
      }

      .status-pill.noted {
        background: #d7e8c8;
        color: #3b2a1f;
      }

      .status-pill.planned {
        background: #f0e0cc;
        color: var(--muted);
      }

      a.inline-link {
        color: var(--accent-deep);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      @keyframes stagger-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* —— 右侧正文 —— */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--panel);
      }

      .main-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border-bottom: 3px solid var(--line);
        flex-shrink: 0;
        min-height: 56px;
      }

      .main-toolbar[hidden] { display: none !important; }

      .btn {
        appearance: none;
        border: 3px solid var(--line);
        background: var(--slot-empty);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        padding: 7px 12px;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--line);
      }

      .btn:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--line);
      }

      .btn:active {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0 var(--line);
      }

      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .btn.danger {
        background: var(--danger);
        color: #fff8f0;
      }

      .spacer { flex: 1; }

      .pane {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 16px 18px 18px;
        overflow: hidden;
      }

      .pane[hidden] { display: none !important; }

      .welcome {
        flex: 1;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 18px;
        padding: 28px;
      }

      .side-foot {
        flex-shrink: 0;
        padding: 10px 12px 12px;
        border-top: 3px solid var(--line);
      }

      .side-foot .btn {
        width: 100%;
        font-size: 13px;
      }

      .pane-activity {
        padding: 16px 18px 18px;
        overflow: auto;
      }

      .activity-card {
        border: 3px solid var(--line);
        background: var(--rail);
        box-shadow: var(--shadow-soft);
        padding: 16px 18px 14px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .activity-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .activity-title {
        color: var(--ink);
        font-size: 20px;
        line-height: 1.2;
      }

      .activity-sub {
        margin-top: 4px;
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--muted);
      }

      .activity-toggle {
        display: inline-flex;
        border: 3px solid var(--line);
        background: var(--panel);
        flex-shrink: 0;
      }

      .activity-toggle button {
        appearance: none;
        border: 0;
        border-right: 3px solid var(--line);
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        cursor: pointer;
      }

      .activity-toggle button:last-child { border-right: 0; }

      .activity-toggle button:hover { color: var(--ink); background: rgba(59, 42, 31, 0.04); }

      .activity-toggle button.active.study {
        background: #239a3b;
        color: #fff8f0;
      }

      .activity-toggle button.active.interrupt {
        background: #c93c37;
        color: #fff8f0;
      }

      .activity-summary {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--ink);
        margin-bottom: 12px;
      }

      .activity-summary strong {
        font-weight: 700;
        color: var(--accent-deep);
      }

      .heatmap-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
        padding-bottom: 6px;
        -webkit-overflow-scrolling: touch;
      }

      .heatmap-scroll-inner {
        width: max-content;
        min-width: 100%;
      }

      .heatmap-months {
        display: grid;
        grid-auto-flow: column;
        height: 14px;
        margin: 0 0 6px 28px;
        font-family: var(--font-body);
        font-size: 10px;
        color: var(--muted);
      }

      .heatmap-months span {
        white-space: nowrap;
        transform: translateX(-2px);
      }

      .heatmap-body {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      .heatmap-wdays {
        display: grid;
        grid-template-rows: repeat(7, 12px);
        gap: 3px;
        font-family: var(--font-body);
        font-size: 10px;
        color: var(--muted);
        width: 20px;
        flex-shrink: 0;
        position: sticky;
        left: 0;
        z-index: 1;
        background: var(--rail);
      }

      .heatmap-wdays span {
        display: flex;
        align-items: center;
        height: 12px;
      }

      .heatmap-grid {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(7, 12px);
        grid-auto-columns: 12px;
        gap: 3px;
      }

      .heat-cell {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        background: #ebedf0;
        outline: 1px solid rgba(27, 31, 35, 0.06);
      }

      .heat-cell.empty { background: transparent; outline: 0; }

      .activity-card[data-metric="study"] .heat-cell.lv-0 { background: #ebedf0; }
      .activity-card[data-metric="study"] .heat-cell.lv-1 { background: #9be9a8; }
      .activity-card[data-metric="study"] .heat-cell.lv-2 { background: #40c463; }
      .activity-card[data-metric="study"] .heat-cell.lv-3 { background: #30a14e; }
      .activity-card[data-metric="study"] .heat-cell.lv-4 { background: #216e39; }

      .activity-card[data-metric="interrupt"] .heat-cell.lv-0 { background: #ebedf0; }
      .activity-card[data-metric="interrupt"] .heat-cell.lv-1 { background: #f9b4ae; }
      .activity-card[data-metric="interrupt"] .heat-cell.lv-2 { background: #f07167; }
      .activity-card[data-metric="interrupt"] .heat-cell.lv-3 { background: #db504a; }
      .activity-card[data-metric="interrupt"] .heat-cell.lv-4 { background: #a32020; }

      .heatmap-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        font-family: var(--font-body);
        font-size: 11px;
        color: var(--muted);
        flex-wrap: wrap;
      }

      .heatmap-legend {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .heatmap-legend .heat-cell {
        width: 11px;
        height: 11px;
      }

      .heat-tip {
        position: fixed;
        z-index: 40;
        pointer-events: none;
        background: var(--toast-bg);
        color: var(--toast-ink);
        font-family: var(--font-body);
        font-size: 12px;
        padding: 6px 10px;
        border: 2px solid var(--line);
        box-shadow: 3px 3px 0 var(--line);
        white-space: nowrap;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.12s ease, transform 0.12s ease;
      }

      .heat-tip.show {
        opacity: 1;
        transform: translateY(0);
      }

      .doc-meta {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .doc-heading {

        line-height: 1.3;

      }

      .mm-status {
        font-size: 12px;
        color: var(--muted);
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pane-course {
        padding-top: 10px;
      }

      .course-mm-head .doc-heading {
        margin-bottom: 4px;
        font-size: 22px;
      }

      .course-mm-split {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(200px, 34%) 1fr;
        gap: 12px;
        margin-top: 8px;
      }

      .course-mm-editor {
        width: 100%;
        height: 100%;
        min-height: 0;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

        background: rgba(255, 255, 255, 0.55);
      }

      .course-mm-map {
        position: relative;
        min-width: 0;
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.4);

      }

      #course-mm-svg {
        width: 100%;
        height: 100%;

      }

      .course-mm-hint {

        bottom: 8px;
        margin: 0;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
      }

      @media (max-width: 900px) {

          grid-template-columns: 1fr;
          grid-template-rows: 36% 1fr;

      .md-body {

      .title-input {

      .edit-split {

      .body-input {

      .toast {

      .shell { position: relative; }

      @media (max-width: 820px) {

      (function () {

        let allNotes = [];

        function showToast(message) {
          toastEl.textContent = message;
          toastEl.classList.remove("show");
          void toastEl.offsetWidth;
          toastEl.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toastEl.classList.remove("show");
          }, 1800);
        }

        async function api(path, method, body) {
          method = method || "GET";
          const hasBody = method === "POST" || method === "PUT";
          const res = await fetch(path, {
            method: method,
            headers: hasBody ? { "Content-Type": "application/json" } : undefined,
            body: hasBody ? JSON.stringify(body == null ? {} : body) : undefined,
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok || data.ok === false) {
            throw new Error(data.message || "请求失败 (" + res.status + ")");
          }
          return data;
        }

        function formatStudyDuration(ms) {
          const n = Math.max(0, Number(ms) || 0);
          if (n <= 0) return "0 小时";
          const hours = n / 3600000;
          if (hours < 0.1) return Math.round(n / 60000) + " 分钟";
          const fixed = hours >= 10 ? hours.toFixed(0) : hours.toFixed(1);
          return fixed.replace(/\.0$/, "") + " 小时";
        }

        function studyLevel(ms) {
          const h = (Number(ms) || 0) / 3600000;
          if (h <= 0) return 0;
          if (h < 0.5) return 1;
          if (h < 1) return 2;
          if (h < 2) return 3;
          return 4;
        }

        function interruptLevel(count) {
          const n = Number(count) || 0;
          if (n <= 0) return 0;
          if (n <= 2) return 1;
          if (n <= 5) return 2;
          if (n <= 10) return 3;
          return 4;
        }

        function parseDayLocal(day) {
          const parts = String(day || "").split("-").map(Number);
          if (parts.length !== 3 || parts.some(function (x) { return !Number.isFinite(x); })) {
            return null;
          }
          return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function formatDayLabel(day) {
          const d = parseDayLocal(day);
          if (!d) return day;
          return (
            d.getFullYear() +
            "年" +
            (d.getMonth() + 1) +
            "月" +
            d.getDate() +
            "日"
          );
        }

        function mondayIndex(date) {
          // Mon=0 … Sun=6
          return (date.getDay() + 6) % 7;
        }

        function hideHeatTip() {
          if (!heatTip) return;
          heatTip.classList.remove("show");
          heatTip.hidden = true;
        }

        function showHeatTip(text, x, y) {
          if (!heatTip) return;
          heatTip.textContent = text;
          heatTip.hidden = false;
          heatTip.classList.add("show");
          const pad = 12;
          const rect = heatTip.getBoundingClientRect();
          let left = x + 14;
          let top = y - rect.height - 10;
          if (left + rect.width > window.innerWidth - pad) {
            left = x - rect.width - 14;
          }
          if (top < pad) top = y + 16;
          heatTip.style.left = left + "px";
          heatTip.style.top = top + "px";
        }

        function setActivityMetric(metric) {
          activityMetric = metric === "interrupt" ? "interrupt" : "study";
          if (activityCard) activityCard.setAttribute("data-metric", activityMetric);
          if (btnHeatStudy) {
            btnHeatStudy.classList.toggle("active", activityMetric === "study");
            btnHeatStudy.setAttribute(
              "aria-selected",
              activityMetric === "study" ? "true" : "false"
            );
          }
          if (btnHeatInterrupt) {
            btnHeatInterrupt.classList.toggle("active", activityMetric === "interrupt");
            btnHeatInterrupt.setAttribute(
              "aria-selected",
              activityMetric === "interrupt" ? "true" : "false"
            );
          }
          if (activityTitle) {
            activityTitle.textContent =
              activityMetric === "study" ? "学习时长" : "切屏与分心";
          }
          if (activitySub) {
            activitySub.textContent =
              activityMetric === "study"
                ? "过去一年每天学了多久"
                : "过去一年每天切屏 + 分心次数";
          }
          renderActivityHeatmap();
        }

        function renderActivityHeatmap() {
          if (!heatmapGrid || !activityData) return;
          const days = Array.isArray(activityData.days) ? activityData.days : [];
          const today = activityData.today || {};
          const totals = activityData.totals || {};

          if (activitySummary) {
            if (activityMetric === "study") {
              activitySummary.innerHTML =
                "近一年共学习 <strong>" +
                formatStudyDuration(totals.studyMs) +
                "</strong>";
            } else {
              activitySummary.innerHTML =
                "近一年切屏 <strong>" +
                (totals.switchCount || 0) +
                "</strong> 次 · 分心 <strong>" +
                (totals.distractCount || 0) +
                "</strong> 次（合计 " +
                (totals.interruptCount || 0) +
                "）";
            }
          }

          if (activityToday) {
            if (activityMetric === "study") {
              activityToday.textContent =
                "今日 " + formatStudyDuration(today.studyMs);
            } else {
              activityToday.textContent =
                "今日打断 " + (today.interruptCount || 0) + " 次";
            }
          }

          heatmapGrid.innerHTML = "";
          if (heatmapMonths) heatmapMonths.innerHTML = "";
          if (!days.length) return;

          const first = parseDayLocal(days[0].day);
          if (!first) return;
          const lead = mondayIndex(first);

          for (let i = 0; i < lead; i += 1) {
            const pad = document.createElement("span");
            pad.className = "heat-cell empty";
            pad.setAttribute("aria-hidden", "true");
            heatmapGrid.appendChild(pad);
          }

          const monthMarks = [];
          let lastMonth = -1;
          days.forEach(function (row, index) {
            const d = parseDayLocal(row.day);
            const cell = document.createElement("span");
            const value =
              activityMetric === "study"
                ? Number(row.studyMs) || 0
                : Number(row.interruptCount) || 0;
            const level =
              activityMetric === "study"
                ? studyLevel(value)
                : interruptLevel(value);
            cell.className = "heat-cell lv-" + level;
            cell.dataset.day = row.day;
            cell.dataset.level = String(level);

            let tip = formatDayLabel(row.day) + "：";
            if (activityMetric === "study") {
              tip += formatStudyDuration(row.studyMs);
            } else {
              tip +=
                "切屏 " +
                (row.switchCount || 0) +
                " · 分心 " +
                (row.distractCount || 0) +
                "（共 " +
                (row.interruptCount || 0) +
                "）";
            }
            cell.title = tip;
            cell.addEventListener("mouseenter", function (e) {
              showHeatTip(tip, e.clientX, e.clientY);
            });
            cell.addEventListener("mousemove", function (e) {
              showHeatTip(tip, e.clientX, e.clientY);
            });
            cell.addEventListener("mouseleave", hideHeatTip);
            heatmapGrid.appendChild(cell);

            if (d && d.getMonth() !== lastMonth) {
              lastMonth = d.getMonth();
              monthMarks.push({
                label: d.getMonth() + 1 + "月",
                week: Math.floor((lead + index) / 7),
              });
            }
          });

          if (heatmapMonths) {
            const weekCount = Math.ceil((lead + days.length) / 7);
            heatmapMonths.style.gridTemplateColumns =
              "repeat(" + weekCount + ", 12px)";
            heatmapMonths.style.columnGap = "3px";
            const used = new Set();
            monthMarks.forEach(function (mark) {
              if (used.has(mark.week)) return;
              used.add(mark.week);
              const span = document.createElement("span");
              span.textContent = mark.label;
              span.style.gridColumn = String(mark.week + 1);
              heatmapMonths.appendChild(span);
            });
          }

          const scrollEl = heatmapGrid && heatmapGrid.closest(".heatmap-scroll");
          if (scrollEl) {
            scrollEl.scrollLeft = scrollEl.scrollWidth;
          }
        }

        function formatTime(ts) {
          const n = Number(ts) || 0;
          if (!n) return "未知时间";
          try {
            return new Date(n).toLocaleString();

            return String(n);
          }

        function rewriteNoteAssetUrls(md) {
          return String(md || "")
            .replace(
              /bilinotes:\/\/asset\/([^/\s)]+)\/([^)\s]+)/g,
              function (_m, bvid, file) {
                return (
                  "/api/notes-assets/" +
                  encodeURIComponent(decodeURIComponent(bvid)) +
                  "/" +
                  encodeURIComponent(decodeURIComponent(file))
                );
              }
            )
            .replace(
              /\]\(file:\/\/[^)\s]*\/notes-assets\/([^)\s]+)\)/g,
              function (_m, rel) {
                const parts = String(rel).split("/").filter(Boolean);
                if (parts.length < 2) return _m;
                return (
                  "](/api/notes-assets/" +
                  encodeURIComponent(decodeURIComponent(parts[0])) +
                  "/" +
                  encodeURIComponent(decodeURIComponent(parts.slice(1).join("/"))) +
                  ")"
                );
              }
            );
        }

        function renderMarkdownInto(el, md, opts) {
          if (!el) return;
          const withMath = !opts || opts.withMath !== false;
          const source = rewriteNoteAssetUrls(md);
          clearTimeout(mathTimer);
          mathTimer = null;
          try {
            if (window.marked && window.marked.parse) {
              const raw = window.marked.parse(source, { gfm: true, breaks: true });
              el.innerHTML =
                window.DOMPurify && window.DOMPurify.sanitize
                  ? window.DOMPurify.sanitize(raw, {
                      USE_PROFILES: { html: true },
                      ADD_TAGS: ["img"],
                      ADD_ATTR: ["src", "alt", "title"],
                      ALLOWED_URI_REGEXP:
                        /^(?:(?:(?:f|ht)tps?|mailto|tel|data):|\/api\/notes-assets\/|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i,
                    })
                  : raw;
            } else {
              el.textContent = source;
            }
            if (!withMath || !window.renderMathInElement) return;
            mathTimer = setTimeout(function () {
              mathTimer = null;
              if (!el.isConnected) return;
              window.renderMathInElement(el, {
                delimiters: [
                  { left: "$$", right: "$$", display: true },
                  { left: "$", right: "$", display: false },
                  { left: "\\(", right: "\\)", display: false },
                  { left: "\\[", right: "\\]", display: true },
                ],
                throwOnError: false,
              });
            }, 0);
          } catch (err) {
            el.textContent = source;
            console.warn("[notes] render failed", err);
          }
        }

        function renderCourseMindmap(markdown) {
          if (!ensureMarkmap() || !courseMmSvg) return;
          try {
            const md = String(markdown || "").trim() || "# 空导图\n## 点「一键生成导图」开始";
            const { root } = mmTransformer.transform(md);
            const opts = window.markmap.deriveOptions
              ? window.markmap.deriveOptions({
                  colorFreezeLevel: 2,
                  maxWidth: 240,
                  duration: 300,
                  initialExpandLevel: 2,
                })
              : undefined;
            if (!mmInstance) {
              mmInstance = window.markmap.Markmap.create(courseMmSvg, opts, root);
            } else {
              mmInstance.setData(root);
              mmInstance.fit();
            }
          } catch (err) {
            console.warn("[mindmap]", err);
            setMmStatus("渲染失败");
          }
        }

            renameBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              renameFolder(folder.id, folder.title, courseId);
            });
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "btn danger";
            delBtn.textContent = "删";
            delBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              deleteFolder(folder.id, folder.title, courseId);
            });
            actions.appendChild(renameBtn);
            actions.appendChild(delBtn);
            head.appendChild(actions);
          }

          head.addEventListener("click", function () {
            if (expandedFolders.has(key)) expandedFolders.delete(key);
            else expandedFolders.add(key);
            renderCourseTree();
          });

          const body = document.createElement("div");
          body.className = "folder-node-body";
          if (!items.length) {
            const empty = document.createElement("div");
            empty.className = "folder-empty";
            empty.textContent = "空文件夹";
            body.appendChild(empty);
          } else {
            items.forEach(function (item) {
              body.appendChild(buildTreeNoteItem(item, courseId, folders));
            });
          }

          node.appendChild(head);
          node.appendChild(body);
          return node;
        }

        function buildCourseNode(summary) {
          const id = summary.id;
          const detail = courseDetails[id] || null;
          const open = expandedCourses.has(id);
          const li = document.createElement("li");
          li.className = "course-node" + (id === activeCourseId ? " active" : "");

          const head = document.createElement("button");
          head.type = "button";
          head.className = "course-node-head";
          const chevron = document.createElement("span");
          chevron.className = "course-chevron";
          chevron.textContent = open ? "▼" : "▶";
          const main = document.createElement("div");
          main.className = "course-node-main";
          const title = document.createElement("div");
          title.className = "course-node-title";
          title.textContent = summary.title || "未命名课程组";
          const sub = document.createElement("div");
          sub.className = "course-node-sub";
          sub.textContent =
            (summary.itemCount || 0) +
            " 个内容 · " +
            (summary.folderCount || 0) +
            " 个文件夹 · " +
            formatTime(summary.updatedAt);
          main.appendChild(title);
          main.appendChild(sub);
          head.appendChild(chevron);
          head.appendChild(main);
          head.addEventListener("click", function () {
            toggleCourse(id);
          });
          li.appendChild(head);

          if (open) {
            const body = document.createElement("div");
            body.className = "course-node-body";

            const actions = document.createElement("div");
            actions.className = "course-node-actions";

            const renameBtn = document.createElement("button");
            renameBtn.type = "button";
            renameBtn.className = "btn";
            renameBtn.textContent = "重命名";
            renameBtn.addEventListener("click", function () {
              renameCourse(id, summary.title);
            });

            const folderBtn = document.createElement("button");
            folderBtn.type = "button";
            folderBtn.className = "btn";
            folderBtn.textContent = "＋ 文件夹";
            folderBtn.addEventListener("click", function () {
              createFolderInCourse(id);
            });

            const addBtn = document.createElement("button");
            addBtn.type = "button";
            addBtn.className = "btn";
            addBtn.textContent = addingCourseId === id ? "收起添加" : "＋ 添加";
            addBtn.addEventListener("click", function () {
              addingCourseId = addingCourseId === id ? null : id;
              renderCourseTree();
            });

            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "btn danger";
            delBtn.textContent = "删除";
            delBtn.addEventListener("click", function () {
              deleteCourse(id, summary.title);
            });

            actions.appendChild(renameBtn);
            actions.appendChild(folderBtn);
            actions.appendChild(addBtn);
            actions.appendChild(delBtn);
            body.appendChild(actions);

            if (!detail) {
              const loading = document.createElement("div");
              loading.className = "folder-empty";
              loading.textContent = "加载中…";
              body.appendChild(loading);
            } else {
              const items = Array.isArray(detail.items) ? detail.items : [];
              const folders = Array.isArray(detail.folders) ? detail.folders : [];
              const byFolder = {};
              items.forEach(function (item) {
                const key = item.folderId || "root";
                if (!byFolder[key]) byFolder[key] = [];
                byFolder[key].push(item);
              });

              if ((byFolder.root || []).length) {
                body.appendChild(
                  buildFolderNode(
                    id,
                    { id: "root", title: "未分类" },
                    byFolder.root || [],
                    folders
                  )
                );
              }

              folders.forEach(function (folder) {
                body.appendChild(
                  buildFolderNode(id, folder, byFolder[folder.id] || [], folders)
                );
              });

              if (!folders.length && !(byFolder.root || []).length) {
                const empty = document.createElement("div");
                empty.className = "folder-empty";
                empty.textContent = "还没有内容，点「＋ 添加」或「＋ 文件夹」";
                body.appendChild(empty);
              }

              if (addingCourseId === id) {
                body.appendChild(buildAddBox(id, folders));
              }
            }

            li.appendChild(body);
          }

          return li;
        }

        function renderCourseTree() {
          courseList.innerHTML = "";
          courseListCount.textContent = "共 " + allCourses.length + " 个课程组";
          courseListEmpty.hidden = allCourses.length > 0;
          courseListEmpty.textContent = "还没有课程组";
          allCourses.forEach(function (item) {
            courseList.appendChild(buildCourseNode(item));
          });
        }

        function renderCourseList(groups) {
          allCourses = Array.isArray(groups) ? groups : allCourses;
          renderCourseTree();
        }

        async function fillAssignFolderSelect(groupId, preferred) {
          const folderSelect = document.getElementById("assign-folder-select");
          if (!folderSelect) return;
          folderSelect.innerHTML = "";
          const root = document.createElement("option");
          root.value = "root";
          root.textContent = "未分类（根目录）";
          folderSelect.appendChild(root);
          if (!groupId) return;
          try {
            const data = await api("/api/course-groups/" + encodeURIComponent(groupId));
            const folders = (data.group && data.group.folders) || [];
            folders.forEach(function (folder) {
              const opt = document.createElement("option");
              opt.value = folder.id;
              opt.textContent = folder.title || "未命名文件夹";
              folderSelect.appendChild(opt);
            });
            if (preferred) {
              folderSelect.value = preferred;
              if (folderSelect.value !== preferred) folderSelect.value = "root";
            }
          } catch (err) {
            showToast(err.message || "加载文件夹失败");
          }
        }

        async function openAssignCourse() {
          if (!activeBvid) {
            showToast("请先打开一条笔记");
            return;
          }
          if (dirty && mode === "edit") {
            await saveCurrent({ silent: true });
          }
          assignReturnMode = mode === "edit" ? "edit" : "preview";
          if (!allCourses.length) await loadCourses();
          if (!allCourses.length) {
            showToast("还没有课程组，请先新建一个");

            return;
          }

            (mode === "edit" ? titleInput.value : previewHeading.textContent) ||

          document.getElementById("assign-note-label").value =
            title + " · " + activeBvid;
          document.getElementById("assign-note-meta").textContent =
            "将笔记加入课程组。写完或写一半都可以，不会改动笔记正文。";

          courseSelect.innerHTML = "";

        function cancelAssignCourse() {
          if (assignReturnMode === "edit") setMode("edit");
          else if (assignReturnMode === "preview") setMode("preview");
          else setMode("welcome");
        }

        async function submitAssignCourse(e) {
          e.preventDefault();
          if (!activeBvid) return;
          const groupId = String(
            document.getElementById("assign-course-select").value || ""
          ).trim();
          const folderRaw = String(

          );

          if (!groupId) {
            showToast("请选择课程组");
            return;
          }
          const title =

              "/api/course-groups/" + encodeURIComponent(groupId) + "/items",
              "POST",
              { bvid: activeBvid, title: title, folderId: folderId }
            );

            setSideView("courses");

        function renderHits(hits) {

            hitsEl.classList.remove("show");
            return;
          }
          hitsEl.classList.add("show");
          hits.forEach(function (hit) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "hit-item";
            const title = document.createElement("strong");
            title.textContent = hit.heading || hit.bvid || "片段";
            const text = document.createElement("span");
            text.textContent = hit.text || "";

            btn.appendChild(text);

              openPreview(hit.bvid);

        async function loadList() {
          try {
            const data = await api("/api/notes");
            allNotes = Array.isArray(data.notes) ? data.notes : [];
            const q = String(searchInput.value || "").trim();
            if (q) {
              await runSearch(q);
            } else {
              renderHits([]);
              renderList(allNotes);
            }
          } catch (err) {
            listCount.textContent = "加载失败";
            listEmpty.hidden = false;
            listEmpty.textContent = err.message || "无法读取笔记库";
            showToast(err.message || "笔记列表加载失败");
          }
        }

        async function runSearch(q) {
          try {
            const data = await api("/api/notes/search?q=" + encodeURIComponent(q));
            const notes = Array.isArray(data.notes) ? data.notes : [];
            const hits = Array.isArray(data.hits) ? data.hits : [];
            renderList(notes);
            renderHits(hits);
          } catch (err) {
            showToast(err.message || "搜索失败");
          }
        }

        function scheduleSearch() {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(function () {
            const q = String(searchInput.value || "").trim();
            if (!q) {
              renderHits([]);
              renderList(allNotes);
              return;
            }
            runSearch(q);
          }, 220);
        }

        async function openPreview(bvid, opts) {
          opts = opts || {};
          if (dirty && activeBvid && mode === "edit") {
            await saveCurrent({ silent: true });
          }
          try {
            const data = await api("/api/notes/" + encodeURIComponent(bvid));
            const doc = data.doc || {};
            activeBvid = doc.bvid || bvid;
            dirty = false;
            if (opts.fromCourseId) {
              noteReturnContext = { type: "course", courseId: String(opts.fromCourseId) };
              activeCourseId = String(opts.fromCourseId);
              setSideView("courses");
            } else if (sideView !== "courses") {
              noteReturnContext = null;
            }
            titleInput.value = doc.title || "";
            bodyInput.value = doc.bodyMd || "";
            const meta =
              activeBvid +
              " · 更新于 " +
              formatTime(doc.updatedAt) +
              (doc.createdAt ? " · 创建于 " + formatTime(doc.createdAt) : "");
            previewMeta.textContent = meta;
            editMeta.textContent = meta;
            previewHeading.textContent = doc.title || activeBvid || "笔记";
            renderMarkdownInto(previewBody, doc.bodyMd || "");
            saveHint.textContent = "修改会自动保存";
            setMode("preview");

            if (sideView === "notes") {
              const q = String(searchInput.value || "").trim();
              if (q) await runSearch(q);
              else renderList(allNotes);

              renderCourseTree();
            }
          } catch (err) {
            showToast(err.message || "打开笔记失败");

        }

        function showEdit() {
          setMode("edit");
          renderMarkdownInto(editPreview, bodyInput.value);
          titleInput.focus();
        }

        async function saveCurrent(opts) {
          opts = opts || {};
          if (!activeBvid) return;
          const title = titleInput.value;
          const bodyMd = bodyInput.value;
          try {
            if (!opts.silent) saveHint.textContent = "保存中…";
            const data = await api("/api/notes/" + encodeURIComponent(activeBvid), "PUT", {
              title: title,
              bodyMd: bodyMd,
            });
            dirty = false;
            const updatedAt = data.doc && data.doc.updatedAt;
            const createdAt = data.doc && data.doc.createdAt;
            const meta =
              activeBvid +
              " · 更新于 " +
              formatTime(updatedAt || Date.now()) +
              (createdAt ? " · 创建于 " + formatTime(createdAt) : "");
            editMeta.textContent = meta;
            previewMeta.textContent = meta;
            previewHeading.textContent = title || activeBvid;
            saveHint.textContent = opts.silent ? "已自动保存" : "已保存";
            if (!opts.silent) showToast("笔记已保存");
            renderMarkdownInto(editPreview, bodyMd);
            await loadList();
          } catch (err) {
            saveHint.textContent = "保存失败";
            showToast(err.message || "保存失败");
          }
        }

        function scheduleSave() {
          if (!activeBvid || mode !== "edit") return;
          dirty = true;
          saveHint.textContent = "有未保存修改…";
          scheduleEditPreview();
          clearTimeout(saveTimer);
          saveTimer = setTimeout(function () {
            saveTimer = null;
            saveCurrent({ silent: true });
          }, 450);
        }

        async function deleteCurrent() {
          if (!activeBvid) return;
          const bvid = activeBvid;
          const ok = window.confirm("确定删除这条笔记？\n" + bvid + "\n删除后不可恢复。");
          if (!ok) return;
          try {
            clearTimeout(saveTimer);
            saveTimer = null;
            dirty = false;
            await api("/api/notes/" + encodeURIComponent(bvid), "DELETE");
            showToast("已删除笔记");
            activeBvid = null;
            setMode("welcome");
            await loadList();
            await loadCourses();
          } catch (err) {
            const msg = String(err.message || err);
            if (/不存在|404|not found/i.test(msg)) {
              showToast("笔记已不在库中");
              activeBvid = null;
              setMode("welcome");
              await loadList();
              await loadCourses();
            } else {
              showToast(msg || "删除失败");
            }
          }
        }

        async function loadCourses() {
          try {
            const data = await api("/api/course-groups");
            allCourses = Array.isArray(data.groups) ? data.groups : [];
            // refresh cached details for expanded courses
            const ids = Array.from(expandedCourses);
            for (let i = 0; i < ids.length; i += 1) {
              try {
                const detail = await api("/api/course-groups/" + encodeURIComponent(ids[i]));
                if (detail.group) {
                  courseDetails[ids[i]] = detail.group;
                  if (activeCourseId === ids[i]) activeCourse = detail.group;
                }
              } catch (_) {}
            }
            renderCourseTree();
          } catch (err) {
            courseListCount.textContent = "加载失败";
            courseListEmpty.hidden = false;
            courseListEmpty.textContent = err.message || "无法读取课程组";
            showToast(err.message || "课程组加载失败");
          }
        }

        async function toggleCourse(id) {
          const key = String(id || "").trim();
          if (!key) return;
          if (expandedCourses.has(key)) {
            expandedCourses.delete(key);
            if (activeCourseId === key) {
              activeCourseId = null;
              activeCourse = null;
              mmLoadedGroupId = null;
              if (mode === "course") setMode("welcome");
            }
            renderCourseTree();
            return;
          }
          await openCourse(key);
        }

        async function openCourse(id) {
          const key = String(id || "").trim();
          if (!key) return;
          try {
            const data = await api("/api/course-groups/" + encodeURIComponent(key));
            const group = data.group;
            if (!group) throw new Error("课程组不存在");
            courseDetails[key] = group;
            activeCourse = group;
            activeCourseId = key;
            expandedCourses.add(key);
            setSideView("courses");
            if (sideCreateBox) sideCreateBox.classList.remove("show");
            renderCourseTree();
            await loadCourseMindmapPane(group);
          } catch (err) {
            showToast(err.message || "打开课程组失败");
          }
        }

        function showCreateCourse() {
          setSideView("courses");
          if (sideCreateBox) sideCreateBox.classList.add("show");
          document.getElementById("create-course-title").value = "";
          document.getElementById("create-course-title").focus();
        }

        async function createCourseFromForm(e) {
          e.preventDefault();
          const title = String(document.getElementById("create-course-title").value || "").trim();
          if (!title) {
            showToast("请填写课程组名称");
            return;

          try {

          if (!id) return;
          const nextTitle = window.prompt("课程组名称", currentTitle || "");
          if (nextTitle == null) return;
          const title = String(nextTitle).trim();
          if (!title) {
            showToast("名称不能为空");

          }

              { title: title, topic: "" }
            );

        async function deleteCourse(courseId, title) {
          const id = String(courseId || activeCourseId || "").trim();
          if (!id) return;
          const name = title || (courseDetails[id] && courseDetails[id].title) || id;
          const ok = window.confirm(
            "确定删除课程组「" + name + "」？\n只会移除分组，不会删除视频笔记。"

            showToast(err.message || "删除失败");

        async function deleteFolder(folderId, title, courseId) {
          const id = String(courseId || activeCourseId || "").trim();
          if (!id || !folderId) return;
          const ok = window.confirm(
            "删除文件夹「" +
              (title || "") +
              "」？\n里面的内容会回到「未分类」，不会移出课程组。"
          );
          if (!ok) return;
          try {
            const data = await api(
              "/api/course-groups/" +
                encodeURIComponent(id) +
                "/folders/" +
                encodeURIComponent(folderId),
              "DELETE"
            );
            showToast("已删除文件夹");
            expandedFolders.delete(folderKey(id, folderId));
            if (data.group) courseDetails[id] = data.group;
            await loadCourses();
          } catch (err) {
            showToast(err.message || "删除失败");
          }
        }

        async function moveVideoToFolder(bvid, folderRaw, courseId) {
          const id = String(courseId || activeCourseId || "").trim();
          if (!id || !bvid) return;
          const folderId = folderRaw === "root" ? null : folderRaw;
          try {
            const data = await api(
              "/api/course-groups/" +
                encodeURIComponent(id) +
                "/items/" +
                encodeURIComponent(bvid),
              "PUT",
              { folderId: folderId }
            );
            showToast("已移动");
            if (data.group) courseDetails[id] = data.group;
            expandedFolders.add(folderKey(id, folderId || "root"));
            await loadCourses();
          } catch (err) {
            showToast(err.message || "移动失败");
          }
        }

        async function removeVideoFromCourse(bvid, courseId) {
          const id = String(courseId || activeCourseId || "").trim();
          if (!id || !bvid) return;
          const ok = window.confirm("从课程组移出该内容？\n" + bvid + "\n不会删除对应笔记。");
          if (!ok) return;
          try {
            const data = await api(
              "/api/course-groups/" +
                encodeURIComponent(id) +
                "/items/" +
                encodeURIComponent(bvid),
              "DELETE"
            );
            showToast("已移出");
            if (data.group) courseDetails[id] = data.group;
            await loadCourses();
          } catch (err) {
            showToast(err.message || "移出失败");
          }
        }

        async function closeNoteView() {
          if (dirty && activeBvid && mode === "edit") {
            await saveCurrent({ silent: true });
          }
          dirty = false;
          activeBvid = null;
          const back = noteReturnContext;
          noteReturnContext = back; // keep course context while returning
          if (back && back.type === "course" && back.courseId) {
            setSideView("courses");
            await openCourse(back.courseId);
            return;
          }
          noteReturnContext = null;
          setMode("welcome");
          const q = String(searchInput.value || "").trim();
          if (sideView === "notes") {
            if (q) runSearch(q);
            else renderList(allNotes);
          } else {
            renderCourseTree();
          }
        }

        searchInput.addEventListener("input", scheduleSearch);
        tabNotes.addEventListener("click", function () {
          setSideView("notes");
          noteReturnContext = null;
        });
        tabCourses.addEventListener("click", function () {
          setSideView("courses");
        });
        if (btnHeatStudy) {
          btnHeatStudy.addEventListener("click", function () {
            setActivityMetric("study");
          });
        }
        if (btnHeatInterrupt) {
          btnHeatInterrupt.addEventListener("click", function () {
            setActivityMetric("interrupt");
          });
        }
        if (btnOpenActivity) {
          btnOpenActivity.addEventListener("click", openActivityView);
        }
        if (btnCloseActivity) {
          btnCloseActivity.addEventListener("click", closeActivityView);
        }
        document.getElementById("btn-new-course").addEventListener("click", showCreateCourse);
        document.getElementById("form-create-course").addEventListener("submit", createCourseFromForm);
        document.getElementById("btn-cancel-create-course").addEventListener("click", function () {
          if (sideCreateBox) sideCreateBox.classList.remove("show");
        });
        document.getElementById("btn-assign-course").addEventListener("click", openAssignCourse);
        document.getElementById("btn-assign-course-edit").addEventListener("click", openAssignCourse);
        document.getElementById("btn-cancel-assign").addEventListener("click", cancelAssignCourse);
        document.getElementById("btn-cancel-assign-form").addEventListener("click", cancelAssignCourse);
        document.getElementById("form-assign-course").addEventListener("submit", submitAssignCourse);
        document.getElementById("assign-course-select").addEventListener("change", function () {
          fillAssignFolderSelect(this.value);
        });

        document.getElementById("btn-close-window").addEventListener("click", function () {
          if (window.biliPet && typeof window.biliPet.closeWindow === "function") {
            window.biliPet.closeWindow();
            return;
          }
          window.close();
        });
        document.getElementById("btn-close-note").addEventListener("click", function () {
          closeNoteView();
        });
        document.getElementById("btn-edit").addEventListener("click", showEdit);
        document.getElementById("btn-back-preview").addEventListener("click", async function () {
          if (dirty) await saveCurrent({ silent: true });
          renderMarkdownInto(previewBody, bodyInput.value);
          previewHeading.textContent = titleInput.value || activeBvid || "笔记";
          setMode("preview");
        });
        document.getElementById("btn-save").addEventListener("click", function () {
          saveCurrent();
        });
        document.getElementById("btn-delete-preview").addEventListener("click", deleteCurrent);
        document.getElementById("btn-delete-edit").addEventListener("click", deleteCurrent);
        titleInput.addEventListener("input", scheduleSave);
        bodyInput.addEventListener("input", scheduleSave);

        if (courseMmEditor) {
          courseMmEditor.addEventListener("input", function () {
            scheduleCourseMindmapRender();
            scheduleCourseMindmapSave();
            setMmStatus("编辑中…");
          });
        }
        if (btnMmGenerate) btnMmGenerate.addEventListener("click", generateCourseMindmapUi);
        if (btnMmFit) {
          btnMmFit.addEventListener("click", function () {
            if (mmInstance) mmInstance.fit();
          });
        }
        if (btnMmSave) {
          btnMmSave.addEventListener("click", function () {
            void saveCourseMindmapNow({ silent: false });
          });
        }

        document.addEventListener("keydown", function (e) {
          if (e.key !== "Escape") return;
          if (mode === "edit") {
            document.getElementById("btn-back-preview").click();
          } else if (mode === "preview") {
            closeNoteView();
          } else if (mode === "assign-course") {
            cancelAssignCourse();
          } else if (mode === "course") {
            setMode("welcome");
          } else if (mode === "activity") {
            closeActivityView();
          } else if (sideCreateBox && sideCreateBox.classList.contains("show")) {
            sideCreateBox.classList.remove("show");
          }
        });

        setMode("welcome");
        setSideView("notes");
        setActivityMetric("study");
        loadList();
        loadCourses();

        function openHomeNoteFromBridge(payload) {
          const bvid = String(payload && payload.bvid ? payload.bvid : "").trim();
          if (!bvid) return;
          void openPreview(bvid);
        }

        if (window.biliPet && typeof window.biliPet.onOpenHomeNote === "function") {
          window.biliPet.onOpenHomeNote(openHomeNoteFromBridge);
        }

        function refreshKnowledgeBaseUi(toastMsg) {
          try {
            if (typeof closeNoteView === "function") closeNoteView();
          } catch (_) {
            /* ignore */
          }
          try {
            setMode("welcome");
            setSideView("notes");
          } catch (_) {
            /* ignore */
          }
          void loadList();
          void loadCourses();
          void loadActivityHeatmap();
          if (toastMsg) showToast(toastMsg);
        }

        if (window.biliPet && typeof window.biliPet.onEvent === "function") {
          window.biliPet.onEvent(function (payload) {
            const kind = String((payload && payload.kind) || "");
            const status = String((payload && payload.status) || "");
            const reason = String((payload && payload.reason) || "");
            const bindStatus = String((payload && payload.bindStatus) || "");

            // 切号/登录同步中：先别刷列表
            if (
              (kind === "account_login" || kind === "account_hello") &&
              (bindStatus === "switched" || bindStatus === "auto_bound")
            ) {
              showToast("正在同步知识库…");
              return;
            }
            if (
              kind === "sync_state" &&
              (status === "switching" ||
                status === "syncing_login" ||
                (status === "pulling" &&
                  (reason === "switch_pull" || reason === "login_pull")))
            ) {
              showToast("正在同步知识库…");
              return;
            }

            if (
              kind === "account_switched" ||
              kind === "kb_account_ready" ||
              (kind === "sync_state" && status === "account_switched")
            ) {
              refreshKnowledgeBaseUi("已切换账号知识库");
              return;
            }

            if (
              kind === "sync_state" &&
              status === "ready" &&
              (reason === "local_only" ||
                reason === "waiting_auth" ||
                reason === "waiting_auth_uid_match")
            ) {
              refreshKnowledgeBaseUi("已切换账号知识库");
            }
          });
        }

        try {
          const bootBvid = new URLSearchParams(window.location.search).get("bvid");
          if (bootBvid) {
            void openPreview(bootBvid);
          }
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
  </body>
</html>
